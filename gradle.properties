# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.3.0
group=net.hibiscus
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Nature's Spirit
mod_author=Team Hibiscus
mod_id=natures_spirit
license=All Rights Reserved
credits=
description=A mod to expand Minecraft's nature!
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.94
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false

# Mixin. Both loaders bundle MixinExtras at runtime, so these are for common compile/AP only.
fabric_mixin_version=0.17.3+mixin.0.8.7
mixin_extras_version=0.5.4

# NightConfig, used by both platforms, only added to Fabric, provided on Neoforge
nightconfig_version=3.8.3

# Optional (Fabric) in case we add a config screen
modmenu_version=18.0.0-alpha.8

# Lithostitched
lithostitched_version=1.7.13
lithostitched_mc=26.1
lithostitched_version_range=[1.7.13,)

# Publishing
curseforge_id=1044992
modrinth_id=WBvnqHfV
github_owner=Team-Hibiscus
github_repo=NatureSpiritForge

# Modpack dev-jar destinations (optional). Path to a production test modpack's `mods/` folder.
fabric_modpack_path=
neoforge_modpack_path=
